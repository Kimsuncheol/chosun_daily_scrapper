services:
  - type: web
    name: chosun-daily-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi db upgrade && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile -
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: chosun-daily-db
          property: connectionString
      - key: SCRAPE_TOKEN
        generateValue: true
      - key: SCRAPER_USER_AGENT
        value: ChosunDailyScraper/1.0

databases:
  - name: chosun-daily-db
    plan: free
    region: singapore
    databaseName: chosun
    user: chosun
    ipAllowList: []
